[project]
name = "guardian-of-truth-guardrail"
version = "1.0.0"
description = "LLM-судья (Qwen3.6-35B-A3B-FP8, vLLM): один токен, логит-разность, порог P>=0.5; веса в model/"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pandas>=2.0",
    "pyarrow>=15",
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
